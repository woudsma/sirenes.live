; PlatformIO Project Configuration
;
; Siren Detector — Seeed Studio XIAO ESP32S3 Firmware
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial monitor (over the S3's native USB-CDC — see build flags below)
monitor_speed = 115200

; huge_app partition (3 MB app) — the Edge Impulse model + SDK do not fit the
; default 1.25 MB app partition. LittleFS holds the web UI + event log. This is a
; ~4 MB layout; the XIAO has 8 MB flash, so the extra space is simply unused for
; now (an 8 MB partition table is a later opportunity).
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

; The ESP32-S3R8 carries 8 MB of octal (OPI) PSRAM. Declare it so the SDK maps it
; and it shows up via ESP.getPsramSize(). We keep the Edge Impulse pool in fast
; internal SRAM for now (see ei_pool.cpp / EI_POOL_BYTES); PSRAM is headroom for
; later tuning. If the build fails on PSRAM init, memory_type is the first knob.
board_build.arduino.memory_type = qio_opi

upload_speed = 115200
upload_flags = --no-stub

; Library dependencies
lib_deps =
    ESP32Async/ESPAsyncWebServer@^3.0.0
    ESP32Async/AsyncTCP@^3.0.0
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0

; Auto-build the web UI before creating the filesystem image
extra_scripts = scripts/build_ui.py

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    ; Route Serial to the S3's native USB-CDC so the serial monitor works over the
    ; USB-C port (there is no separate UART bridge on the XIAO).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Enable the 8 MB OPI PSRAM (paired with board_build.arduino.memory_type above).
    -DBOARD_HAS_PSRAM
    ; Place the EON model's TFLite tensor arena (~14 KB) in static BSS instead of
    ; allocating it from the heap on every inference. The DSP's remaining
    ; allocations (MFCC/FFT scratch, ~20-30 KB per 250 ms slice) come from the
    ; dedicated EI heap — see ei_pool.cpp / EI_POOL_BYTES in config.h.
    -DEI_CLASSIFIER_ALLOCATION_STATIC=1
