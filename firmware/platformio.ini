; PlatformIO Project Configuration
;
; Siren Detector — Seeed Studio XIAO ESP32S3 Firmware
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial monitor (over the S3's native USB-CDC — see build flags below)
monitor_speed = 115200

; Custom 8 MB table (see partitions_8mb.csv): 3 MB app (the Edge Impulse model +
; SDK do not fit the default 1.25 MB partition) + ~4.9 MB LittleFS for the web UI,
; event log and upload-fallback clips. Switching tables moves/resizes the FS
; partition, so flash firmware AND filesystem together the first time.
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs

; The ESP32-S3R8 carries 8 MB of octal (OPI) PSRAM. It holds the audio buffers:
; clip capture (clips.cpp) and the Record-tab buffer (record.cpp), ~1.3 MB. The
; Edge Impulse pool stays in fast internal SRAM (ei_pool.cpp / EI_POOL_BYTES) —
; the DSP hammers its scratch buffers. If the build fails on PSRAM init,
; memory_type is the first knob.
board_build.arduino.memory_type = qio_opi

upload_speed = 115200
upload_flags = --no-stub

; Library dependencies
lib_deps =
    ESP32Async/ESPAsyncWebServer@^3.0.0
    ESP32Async/AsyncTCP@^3.0.0
    fastled/FastLED@^3.6.0
    bblanchon/ArduinoJson@^7.0.0

; Auto-build the web UI before creating the filesystem image
extra_scripts = scripts/build_ui.py

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    ; Route Serial to the S3's native USB-CDC so the serial monitor works over the
    ; USB-C port (there is no separate UART bridge on the XIAO).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Enable the 8 MB OPI PSRAM (paired with board_build.arduino.memory_type above).
    -DBOARD_HAS_PSRAM
    ; Place the EON model's TFLite tensor arena (~14 KB) in static BSS instead of
    ; allocating it from the heap on every inference. The DSP's remaining
    ; allocations (MFCC/FFT scratch, ~20-30 KB per 250 ms slice) come from the
    ; dedicated EI heap — see ei_pool.cpp / EI_POOL_BYTES in config.h.
    -DEI_CLASSIFIER_ALLOCATION_STATIC=1
